name: sparql

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-engine: &engine
  image: ${QLEVER_IMAGE:-adfreiburg/qlever@sha256:32836c914eabdc9107669f154305b53708a817d1ff5b2d9881d1274dbfb174c2}
  # Bypass the image's interactive/sudo entrypoint; Compose owns the lifecycle.
  entrypoint: ["/bin/bash"]
  user: "${QLEVER_UID:-1000}:${QLEVER_GID:-1000}"
  working_dir: /data
  init: true
  volumes:
    - ${QLEVER_DATA_DIR:-./data/imdb}:/data
    - ./docker:/deploy:ro
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
  logging: *logging

services:
  qlever:
    <<: *engine
    command: ["/deploy/start-engine.sh"]
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: ${QLEVER_MEMORY_LIMIT:-8g}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      QLEVER_MEMORY_FOR_QUERIES: ${QLEVER_MEMORY_FOR_QUERIES:-4G}
      QLEVER_CACHE_MAX_SIZE: ${QLEVER_CACHE_MAX_SIZE:-1G}
      QLEVER_CACHE_SINGLE_ENTRY: ${QLEVER_CACHE_SINGLE_ENTRY:-256M}
      QLEVER_CONCURRENT_QUERIES: ${QLEVER_CONCURRENT_QUERIES:-2}
      QLEVER_QUERY_TIMEOUT: ${QLEVER_QUERY_TIMEOUT:-60s}
      # "-" disables outbound SERVICE requests on this public endpoint.
      QLEVER_SERVICE_ALLOW_PREFIX: ${QLEVER_SERVICE_ALLOW_PREFIX:--}
    expose: ["7001"]
    networks: [traefik_proxy]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:7001/?cmd=stats"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik_proxy
      traefik.http.routers.sparql-api.rule: "Host(`${SPARQL_DOMAIN:-sparql.simovi.org}`) && (Path(`/api`) || PathPrefix(`/api/`))"
      traefik.http.routers.sparql-api.priority: "100"
      traefik.http.routers.sparql-api.entrypoints: ${TRAEFIK_HTTPS_ENTRYPOINT:-websecure}
      traefik.http.routers.sparql-api.tls: "true"
      traefik.http.routers.sparql-api.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.routers.sparql-api.service: sparql-api
      traefik.http.routers.sparql-api.middlewares: sparql-api-strip
      traefik.http.middlewares.sparql-api-strip.stripprefix.prefixes: /api
      traefik.http.services.sparql-api.loadbalancer.server.port: "7001"

  qlever-ui:
    image: ${QLEVER_UI_IMAGE:-adfreiburg/qlever-ui@sha256:2bdbfac438c8d43ae5337bb547993b1880e5c43b63871c74ca180aa123644851}
    init: true
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        python /deploy/init-ui.py
        exec gunicorn --bind 0.0.0.0:7000 --workers 3 --limit-request-line 10000 --access-logfile - --error-logfile - qlever.wsgi:application
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: ${QLEVER_UI_MEMORY_LIMIT:-512m}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      QLEVERUI_DEBUG: "False"
      QLEVERUI_SECRET_KEY_FILE: /run/secrets/ui_secret_key
      QLEVERUI_ALLOWED_HOSTS: ${SPARQL_DOMAIN:-sparql.simovi.org}
      QLEVERUI_CSRF_TRUSTED_ORIGINS: https://${SPARQL_DOMAIN:-sparql.simovi.org}
      QLEVERUI_DATABASE_URL: sqlite:////app/db/qleverui.sqlite3
      QLEVERUI_BACKEND: ${QLEVER_UI_BACKEND:-imdb}
      QLEVERUI_PUBLIC_ENDPOINT: https://${SPARQL_DOMAIN:-sparql.simovi.org}/api
    secrets: [ui_secret_key]
    volumes:
      # Docker seeds a fresh volume with the database shipped in the image.
      - qlever_ui_db:/app/db
      - ./docker:/deploy:ro
      - ./docker/settings_local.py:/app/qlever/settings_local.py:ro
      - ./docker/static_storage.py:/app/qlever/production_storage.py:ro
    expose: ["7000"]
    depends_on:
      qlever:
        condition: service_healthy
    networks: [traefik_proxy]
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "/deploy/check-ui.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik_proxy
      traefik.http.routers.sparql-ui.rule: Host(`${SPARQL_DOMAIN:-sparql.simovi.org}`)
      traefik.http.routers.sparql-ui.priority: "10"
      traefik.http.routers.sparql-ui.entrypoints: ${TRAEFIK_HTTPS_ENTRYPOINT:-websecure}
      traefik.http.routers.sparql-ui.tls: "true"
      traefik.http.routers.sparql-ui.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.routers.sparql-ui.service: sparql-ui
      traefik.http.services.sparql-ui.loadbalancer.server.port: "7000"
      traefik.http.routers.sparql-http.rule: Host(`${SPARQL_DOMAIN:-sparql.simovi.org}`)
      traefik.http.routers.sparql-http.entrypoints: ${TRAEFIK_HTTP_ENTRYPOINT:-web}
      traefik.http.routers.sparql-http.middlewares: sparql-https
      traefik.http.routers.sparql-http.service: sparql-ui
      traefik.http.middlewares.sparql-https.redirectscheme.scheme: https
      traefik.http.middlewares.sparql-https.redirectscheme.permanent: "true"

  qlever-manage:
    <<: *engine
    profiles: [tools]
    entrypoint: ["/bin/bash", "/deploy/manage.sh"]
    command: ["help"]
    restart: "no"
    # Downloading needs outbound internet, but maintenance is never proxied.
    networks: [default]
    labels:
      traefik.enable: "false"

networks:
  traefik_proxy:
    external: true
    name: traefik_proxy

volumes:
  qlever_ui_db:

secrets:
  ui_secret_key:
    file: ./secrets/ui_secret_key
